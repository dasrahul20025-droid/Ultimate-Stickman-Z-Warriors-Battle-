<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ultimate Stickman Warriors: Budokai Edition</title>
<meta name="monetag" content="b90928a19caefac6315793bb4f6d8d6a">
<style>
:root { color-scheme: dark; --btn-scale: 1; --btn-alpha: 0.88; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body {
  margin: 0; width: 100%; height: 100%; background: #04040a; overflow: hidden;
  touch-action: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #fff;
}
#g {
  position: relative; width: 100vw; height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  overflow: hidden; background: radial-gradient(circle at center, #0e122a 0%, #030308 100%);
}
/* ADAPTIVE PORTRAIT & LANDSCAPE CANVAS */
#c {
  display: block; background: #000;
  box-shadow: 0 6px 35px rgba(0,0,0,0.95);
  transition: margin-top 0.2s;
}
/* Landscape: Full screen 16:9 centered */
body.mode-landscape #g { justify-content: center; }
body.mode-landscape #c {
  width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
}
/* Portrait: Screen docked cleanly at the top, controller deck below so buttons NEVER block fighters! */
body.mode-portrait #g { justify-content: flex-start; }
body.mode-portrait #c {
  margin-top: 48px;
  width: 100vw; height: min(58vw, 46vh);
  border-bottom: 2px solid rgba(100, 170, 255, 0.35);
}

/* MENUS & OVERLAYS */
#ui {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0.6rem;
  background: radial-gradient(circle at center, rgba(10,14,40,0.78) 0%, rgba(2,2,10,0.95) 100%);
  backdrop-filter: blur(6px); text-align: center; padding: 0.8rem; z-index: 40;
  overflow-y: auto;
}
h1 {
  font-size: clamp(1.9rem, 5.5vw, 4rem); line-height: 0.95; margin: 0;
  font-style: italic; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(180deg, #ffffff 0%, #ffe66d 35%, #ff8800 75%, #ff2200 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 18px rgba(255, 110, 0, 0.75));
  animation: pulseTitle 2.2s infinite alternate;
}
@keyframes pulseTitle {
  to { filter: drop-shadow(0 0 28px rgba(60, 200, 255, 0.95)); transform: scale(1.02); }
}
h2 {
  margin: 0; font-size: clamp(1rem, 2.6vw, 1.65rem); color: #ffd644;
  text-shadow: 0 0 12px #ff7700; text-transform: uppercase; letter-spacing: 1.5px;
}
.menu-btns {
  display: flex; flex-wrap: wrap; gap: 0.55rem; justify-content: center; max-width: 680px;
}
.b {
  background: linear-gradient(180deg, #28338a 0%, #111640 100%);
  border: 2px solid #6c80ff; color: #fff; padding: 0.6rem 1.2rem;
  font-size: clamp(0.8rem, 1.9vw, 1.05rem); font-weight: 800; letter-spacing: 0.06em;
  cursor: pointer; border-radius: 0.65rem; transition: 0.15s;
  text-transform: uppercase; min-width: 9.5rem;
  box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.3);
}
.b:hover, .b:focus {
  transform: translateY(-2px) scale(1.03); border-color: #ffcc00;
  box-shadow: 0 0 18px rgba(255, 180, 0, 0.8); outline: 0;
}
.b:active { transform: scale(0.96); }
.b.start-btn {
  background: linear-gradient(180deg, #ff9900 0%, #cc3300 100%);
  border-color: #ffee66; font-size: clamp(0.95rem, 2.2vw, 1.2rem);
  box-shadow: 0 0 22px rgba(255,120,0,0.7);
}
/* CHARACTER & STAGE SELECT */
.sel-wrap {
  display: flex; flex-direction: column; gap: 0.45rem; width: min(96vw, 920px); align-items: center;
}
.grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; width: 100%;
}
.cb {
  background: linear-gradient(180deg, #191f52 0%, #0b0e29 100%);
  border: 2px solid #4552b8; border-radius: 0.55rem; color: #fff;
  padding: 0.2rem; font-size: clamp(0.68rem, 1.4vw, 0.88rem); cursor: pointer;
  transition: 0.15s; display: flex; flex-direction: column; align-items: center; position: relative;
}
.cb:hover, .cb.picked {
  transform: translateY(-2px) scale(1.03); border-color: #ffcc00;
  box-shadow: 0 0 16px rgba(255, 190, 0, 0.85);
  background: linear-gradient(180deg, #3c2e12 0%, #1c1508 100%);
}
.cb[disabled] { opacity: 0.4; cursor: not-allowed; }
.cb canvas { width: clamp(40px, 6.5vw, 64px); height: clamp(50px, 8vw, 80px); }
.cb i { font-size: 0.66em; color: #ffb700; font-style: normal; }

/* STAGE CARDS */
.stg-row {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.35rem; width: 100%;
}
@media (max-width: 720px) {
  .stg-row { grid-template-columns: repeat(4, 1fr); }
}
.st-card {
  background: #101432; border: 2px solid #4450aa; border-radius: 0.45rem;
  padding: 0.2rem; cursor: pointer; color: #fff; font-size: clamp(0.62rem, 1.2vw, 0.78rem);
  font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
  transition: 0.15s;
}
.st-card .st-prev {
  width: 100%; height: clamp(20px, 3.5vh, 34px); border-radius: 0.25rem;
  border: 1px solid rgba(255,255,255,0.25);
}
.st-card.on, .st-card:hover {
  border-color: #ffcc00; background: #3b2a10;
  box-shadow: 0 0 12px rgba(255,190,0,0.7); transform: scale(1.03);
}
#info {
  min-height: 2.2em; font-size: clamp(0.72rem, 1.5vw, 0.9rem);
  color: #b8f2ff; background: rgba(0,0,0,0.55); padding: 0.3rem 0.8rem;
  border-radius: 0.5rem; border: 1px solid rgba(100,180,255,0.3); width: 100%;
}

/* FULLY CUSTOMIZABLE PSP BUDOKAI CONTROLLER */
#pad {
  display: none; position: fixed; inset: 0; pointer-events: none; z-index: 25;
}
body.show-pad.bt #pad, body.edit-controls #pad { display: block; }
#pad .ctrl-item {
  position: absolute; pointer-events: auto; touch-action: none;
  transform: translate(-50%, -50%) scale(var(--btn-scale));
  opacity: var(--btn-alpha);
  transition: box-shadow 0.1s;
}
body.edit-controls #pad .ctrl-item {
  outline: 2.5px dashed #ffdd00;
  box-shadow: 0 0 18px rgba(255, 220, 0, 0.65) !important;
  cursor: grab;
}
body.edit-controls #pad .ctrl-item.dragging {
  outline: 3px solid #00ffcc;
  box-shadow: 0 0 28px #00ffcc !important;
  z-index: 50;
}

/* Analog Joystick */
#js {
  width: 146px; height: 146px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(20,25,50,0.68) 75%, rgba(10,12,28,0.88) 100%);
  border: 3px solid rgba(190, 220, 255, 0.65);
  box-shadow: 0 8px 25px rgba(0,0,0,0.75), inset 0 0 20px rgba(255,255,255,0.12);
}
#js::before {
  content: '▲'; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: rgba(255,255,255,0.45); pointer-events: none;
}
#js::after {
  content: '▼'; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: rgba(255,255,255,0.45); pointer-events: none;
}
#kn {
  position: absolute; left: 50%; top: 50%;
  width: 64px; height: 64px; margin-left: -32px; margin-top: -32px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffe066, #ff8800 70%, #b34700 100%);
  border: 2.5px solid #fff;
  box-shadow: 0 5px 15px rgba(0,0,0,0.75), inset 0 2px 5px rgba(255,255,255,0.6);
  pointer-events: none;
}

/* Shoulder Triggers (L: Aura, R: Guard) */
.psp-sh {
  width: 114px; height: 48px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(70, 95, 165, 0.88) 0%, rgba(24, 32, 65, 0.94) 100%);
  border: 2.5px solid rgba(165, 210, 255, 0.85); color: #fff;
  font-weight: 900; font-size: 0.82rem; letter-spacing: 0.5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.65), inset 0 2px 4px rgba(255,255,255,0.35);
}
.psp-sh small { font-size: 0.62em; color: #ffd866; font-weight: 700; }

/* Pill Utility Buttons (Form & Fly) */
.psp-pill {
  padding: 0.45rem 0.85rem; border-radius: 999px;
  background: linear-gradient(180deg, rgba(65, 42, 120, 0.9), rgba(25, 15, 55, 0.95));
  border: 2px solid #b58cff; color: #fff; font-weight: 900;
  font-size: 0.78rem; letter-spacing: 0.5px; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,0.65);
  display: flex; align-items: center; gap: 4px;
}
#btn-fly { border-color: #5ce1ff; background: linear-gradient(180deg, rgba(20, 95, 140, 0.9), rgba(10, 40, 70, 0.95)); }

/* Individual Face & Special Beam Buttons */
.face-btn {
  width: 62px; height: 62px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(52, 62, 108, 0.94), rgba(16, 20, 44, 0.98));
  border: 2.5px solid rgba(255,255,255,0.8);
  color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.75), inset 0 2px 4px rgba(255,255,255,0.3);
}
.face-btn .sym { font-size: 1.25rem; font-weight: 900; line-height: 1; }
.face-btn .lbl { font-size: 0.56rem; font-weight: 800; opacity: 0.95; margin-top: 2px; letter-spacing: 0.3px; }

#btn-tri { border-color: #52ff9a; } #btn-tri .sym { color: #52ff9a; }
#btn-cir { border-color: #ff6666; } #btn-cir .sym { color: #ff6666; }
#btn-sq  { border-color: #ff85e4; } #btn-sq  .sym { color: #ff85e4; }
#btn-crs { border-color: #66b8ff; } #btn-crs .sym { color: #66b8ff; }

/* Dedicated Special Beam & Ultimate Buttons */
#btn-sp {
  width: 68px; height: 68px;
  background: radial-gradient(circle at 30% 30%, rgba(0, 140, 255, 0.92), rgba(0, 45, 115, 0.96));
  border: 2.5px solid #66e8ff;
  box-shadow: 0 0 16px rgba(0, 195, 255, 0.55);
}
#btn-sp .sym { color: #ffffff; font-size: 1.15rem; }
#btn-sp .lbl { color: #99f2ff; font-size: 0.52rem; }

#btn-ult {
  width: 72px; height: 72px;
  background: radial-gradient(circle at 30% 30%, rgba(255, 145, 0, 0.95), rgba(140, 25, 0, 0.98));
  border: 2.5px solid #ffee55;
  box-shadow: 0 0 20px rgba(255, 140, 0, 0.65);
}
#btn-ult .sym { color: #ffee66; font-size: 1.25rem; }
#btn-ult .lbl { color: #ffffff; font-size: 0.52rem; }

.ctrl-item.p, .psp-pill.active-fly {
  background: radial-gradient(circle, #ffe042, #ff5500) !important;
  border-color: #ffffff !important;
  box-shadow: 0 0 24px #ff9900 !important;
  transform: translate(-50%, -50%) scale(calc(var(--btn-scale) * 0.91)) !important;
}
.ctrl-item.p span, .ctrl-item.p small { color: #000 !important; }

/* TOP BAR CONTROLS */
#top-btns {
  display: none; position: fixed; top: 6px; left: 50%; transform: translateX(-50%);
  gap: 6px; z-index: 35; width: max-content; max-width: 98vw;
  justify-content: center; flex-wrap: nowrap;
}
body.bt #top-btns { display: flex; }
.top-ic {
  height: 34px; padding: 0 10px; border-radius: 17px;
  border: 1.5px solid rgba(255,255,255,0.6); background: rgba(10, 14, 35, 0.82);
  color: #fff; font-weight: 800; font-size: 0.74rem; cursor: pointer;
  display: flex; align-items: center; gap: 4px; backdrop-filter: blur(4px);
  white-space: nowrap;
}
.top-ic:hover, .top-ic.on { border-color: #ffcc00; background: rgba(55, 45, 15, 0.92); color: #ffd844; }

/* CUSTOM CONTROL LAYOUT EDITOR BAR */
#layout-editor {
  display: none; position: fixed; top: 46px; left: 50%; transform: translateX(-50%);
  background: rgba(10, 14, 38, 0.95); border: 2px solid #ffcc00;
  border-radius: 14px; padding: 8px 14px; z-index: 60;
  width: min(94vw, 520px); flex-direction: column; gap: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.85); text-align: center;
}
body.edit-controls #layout-editor { display: flex; }
.ed-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 0.78rem; font-weight: 700; color: #bfe8ff;
}
.ed-row input[type=range] { flex: 1; accent-color: #ffaa00; }
.ed-btns { display: flex; gap: 6px; justify-content: center; margin-top: 2px; }
.ed-btn {
  padding: 5px 11px; border-radius: 8px; border: 1.5px solid #88aaff;
  background: #1c255c; color: #fff; font-weight: 800; font-size: 0.75rem; cursor: pointer;
}
.ed-btn.save { background: linear-gradient(180deg,#28a745,#166528); border-color: #7dff9a; }
.ed-btn.rst  { background: linear-gradient(180deg,#b02a37,#68141c); border-color: #ff8585; }
</style>
</head>
<body class="mode-landscape">
<div id="g">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="ui"></div>

  <!-- FULLY CUSTOMIZABLE PSP BUDOKAI CONTROLLER OVERLAY -->
  <div id="pad">
    <div class="ctrl-item" id="js" data-id="js"><div id="kn"></div></div>

    <div class="ctrl-item psp-sh" id="btn-l" data-id="btn-l" data-k="ch">
      <span>L · AURA</span>
      <small>HOLD CHARGE</small>
    </div>

    <div class="ctrl-item psp-sh" id="btn-r" data-id="btn-r" data-k="blk">
      <span>R · GUARD</span>
      <small>SHIELD / TELE</small>
    </div>

    <div class="ctrl-item psp-pill" id="btn-tr" data-id="btn-tr" data-k="tr">⚡ FORM</div>
    <div class="ctrl-item psp-pill" id="btn-fly" data-id="btn-fly">🕊️ FLY</div>

    <div class="ctrl-item face-btn" id="btn-tri" data-id="btn-tri" data-k="h">
      <span class="sym">△</span>
      <span class="lbl">SMASH</span>
    </div>
    <div class="ctrl-item face-btn" id="btn-sq" data-id="btn-sq" data-k="a">
      <span class="sym">□</span>
      <span class="lbl">RUSH</span>
    </div>
    <div class="ctrl-item face-btn" id="btn-cir" data-id="btn-cir" data-k="k">
      <span class="sym">○</span>
      <span class="lbl">KI BLAST</span>
    </div>
    <div class="ctrl-item face-btn" id="btn-crs" data-id="btn-crs" data-k="dash">
      <span class="sym">✕</span>
      <span class="lbl">Z-DASH</span>
    </div>

    <!-- DEDICATED SPECIAL BEAM & ULTIMATE ATTACK BUTTONS -->
    <div class="ctrl-item face-btn" id="btn-sp" data-id="btn-sp" data-k="spbeam">
      <span class="sym">☄️</span>
      <span class="lbl" id="lbl-sp">SPECIAL</span>
    </div>
    <div class="ctrl-item face-btn" id="btn-ult" data-id="btn-ult" data-k="ult">
      <span class="sym">💥</span>
      <span class="lbl" id="lbl-ult">ULTIMATE</span>
    </div>
  </div>

  <!-- TOP BAR -->
  <div id="top-btns">
    <button class="top-ic" id="ori-tog" title="Switch Portrait / Landscape">📱 View</button>
    <button class="top-ic" id="edit-tog" title="Drag & Customize Buttons">🔧 Move Buttons</button>
    <button class="top-ic" id="pad-tog" title="Show/Hide Touch Pad">🎮 Pad</button>
    <button class="top-ic" id="pz" title="Pause Game">⏸ Pause</button>
  </div>

  <!-- DRAG & DROP CONTROL EDITOR PANEL -->
  <div id="layout-editor">
    <div style="font-weight:900;color:#ffd844;font-size:0.85rem">✋ DRAG ANY BUTTON TO ARRANGE YOUR LAYOUT</div>
    <div class="ed-row">
      <span>Button Size</span>
      <input type="range" id="rng-scale" min="0.65" max="1.45" step="0.05" value="1">
      <span id="val-scale">100%</span>
    </div>
    <div class="ed-row">
      <span>Transparency</span>
      <input type="range" id="rng-alpha" min="0.3" max="1.0" step="0.05" value="0.88">
      <span id="val-alpha">88%</span>
    </div>
    <div class="ed-btns">
      <button class="ed-btn rst" id="btn-ed-reset">↺ Reset Default</button>
      <button class="ed-btn save" id="btn-ed-done">✔ Save & Resume</button>
    </div>
  </div>
</div>

<script>
const $ = q => document.querySelector(q);
const cv = $('#c'), X = cv.getContext('2d');
const W = 960, H = 540, G = 455;
const R = Math.random, ab = Math.abs, sg = v => v < 0 ? -1 : 1, cl = (v, a, b) => Math.max(a, Math.min(b, v));

let sv = {
  wins: 0, xp: 0, zeni: 0, vol: 0.6,
  pad: 1,
  ori: 'auto', // 'auto', 'portrait', 'landscape'
  btnScale: 1,
  btnAlpha: 0.88,
  layouts: { portrait: {}, landscape: {} }
};
try { Object.assign(sv, JSON.parse(localStorage.getItem('usw_budokai_v2'))); } catch(e) {}
const save = () => { try { localStorage.setItem('usw_budokai_v2', JSON.stringify(sv)); } catch(e) {} };
if (sv.pad) document.body.classList.add('show-pad');

/* DEFAULT BUTTON POSITIONS (% of viewport width & height)
   In Portrait mode, the screen is at top (y: 8% to 52%), so ALL buttons sit cleanly in the lower deck (y: 56% to 92%)! */
const DEFAULT_LAYOUTS = {
  portrait: {
    'js':      { x: 23, y: 80 },
    'btn-l':   { x: 20, y: 58 },
    'btn-tr':  { x: 41, y: 58 },
    'btn-fly': { x: 59, y: 58 },
    'btn-r':   { x: 80, y: 58 },
    'btn-sp':  { x: 48, y: 72 },
    'btn-ult': { x: 48, y: 87 },
    'btn-tri': { x: 77, y: 69 },
    'btn-sq':  { x: 64, y: 80 },
    'btn-cir': { x: 90, y: 80 },
    'btn-crs': { x: 77, y: 91 }
  },
  landscape: {
    'js':      { x: 14, y: 74 },
    'btn-l':   { x: 11, y: 42 },
    'btn-tr':  { x: 24, y: 42 },
    'btn-fly': { x: 76, y: 42 },
    'btn-r':   { x: 89, y: 42 },
    'btn-sp':  { x: 69, y: 62 },
    'btn-ult': { x: 69, y: 83 },
    'btn-tri': { x: 85, y: 58 },
    'btn-sq':  { x: 78, y: 73 },
    'btn-cir': { x: 92, y: 73 },
    'btn-crs': { x: 85, y: 88 }
  }
};

function getActiveOrientation() {
  if (sv.ori === 'portrait') return 'portrait';
  if (sv.ori === 'landscape') return 'landscape';
  return window.innerHeight > window.innerWidth * 1.05 ? 'portrait' : 'landscape';
}

function applyOrientationAndLayout() {
  const mode = getActiveOrientation();
  document.body.classList.toggle('mode-portrait', mode === 'portrait');
  document.body.classList.toggle('mode-landscape', mode === 'landscape');
  $('#ori-tog').textContent = mode === 'portrait' ? '📱 Portrait' : '🖥️ Landscape';

  document.documentElement.style.setProperty('--btn-scale', sv.btnScale || 1);
  document.documentElement.style.setProperty('--btn-alpha', sv.btnAlpha || 0.88);
  $('#rng-scale').value = sv.btnScale || 1;
  $('#val-scale').textContent = Math.round((sv.btnScale || 1) * 100) + '%';
  $('#rng-alpha').value = sv.btnAlpha || 0.88;
  $('#val-alpha').textContent = Math.round((sv.btnAlpha || 0.88) * 100) + '%';

  const def = DEFAULT_LAYOUTS[mode];
  const custom = (sv.layouts && sv.layouts[mode]) || {};
  document.querySelectorAll('#pad .ctrl-item').forEach(el => {
    const id = el.dataset.id;
    const pos = custom[id] || def[id] || { x: 50, y: 50 };
    el.style.left = cl(pos.x, 5, 95) + 'vw';
    el.style.top  = cl(pos.y, 8, 95) + 'vh';
  });
}
window.addEventListener('resize', applyOrientationAndLayout);
applyOrientationAndLayout();

/* ============================================================================
   MULTI-LAYERED DBZ BUDOKAI TENKAICHI AUDIO & CHARACTER VOICE SFX ENGINE
   ============================================================================ */
let AC, noiseBuf;
const au = () => {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      // Pre-generate white noise buffer for realistic anime explosions, wind whooshes, and punch snaps
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 1.5, AC.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch(e) {}
};

// Synthesize character-specific vocal battle cries & grunts using formant-filtered oscillators
function voiceSFX(charIdx, type) {
  if (!AC || !sv.vol) return;
  try {
    const n = AC.currentTime, v = sv.vol * 0.34;
    // Character voice pitch profile (Goku, Vegeta, Gohan, Trunks, Piccolo, Krillin, Broly, Frieza, Cell, Beerus)
    const pitches = [195, 165, 215, 200, 130, 240, 115, 255, 145, 175];
    const baseF = pitches[charIdx ?? 0] || 185;

    const o1 = AC.createOscillator(), o2 = AC.createOscillator();
    const flt = AC.createBiquadFilter(), g = AC.createGain();
    o1.type = 'sawtooth'; o2.type = 'triangle';
    flt.type = 'bandpass'; flt.Q.value = 3.5;

    let dur = 0.16;
    if (type === 'atk') { // Sharp martial arts kiai ("Haa!", "Taa!")
      dur = 0.14;
      o1.frequency.setValueAtTime(baseF * 1.05, n);
      o1.frequency.exponentialRampToValueAtTime(baseF * 1.45, n + 0.05);
      o1.frequency.exponentialRampToValueAtTime(baseF * 0.9, n + dur);
      flt.frequency.setValueAtTime(950, n);
      flt.frequency.linearRampToValueAtTime(1400, n + dur);
    } else if (type === 'hvy') { // Fierce smash roar ("DAAAH!")
      dur = 0.28;
      o1.frequency.setValueAtTime(baseF * 0.9, n);
      o1.frequency.exponentialRampToValueAtTime(baseF * 1.65, n + 0.09);
      o1.frequency.exponentialRampToValueAtTime(baseF * 1.1, n + dur);
      flt.frequency.setValueAtTime(800, n);
      flt.frequency.linearRampToValueAtTime(1650, n + dur);
    } else if (type === 'sp' || type === 'ult') { // Iconic beam shout ("KAMEHAME-HA!" / "FINAL FLASH!")
      dur = type === 'ult' ? 0.65 : 0.45;
      o1.frequency.setValueAtTime(baseF * 1.1, n);
      o1.frequency.linearRampToValueAtTime(baseF * 1.85, n + dur * 0.6);
      o1.frequency.exponentialRampToValueAtTime(baseF * 1.3, n + dur);
      flt.frequency.setValueAtTime(1100, n);
      flt.frequency.linearRampToValueAtTime(1900, n + dur);
    } else if (type === 'hurt') { // Pain grunt ("Ugh!")
      dur = 0.18;
      o1.frequency.setValueAtTime(baseF * 1.2, n);
      o1.frequency.exponentialRampToValueAtTime(baseF * 0.65, n + dur);
      flt.frequency.setValueAtTime(700, n);
    }
    o2.frequency.value = baseF * 0.5;
    g.gain.setValueAtTime(0.001, n);
    g.gain.linearRampToValueAtTime(v, n + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, n + dur);

    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(AC.destination);
    o1.start(n); o2.start(n); o1.stop(n + dur + 0.02); o2.stop(n + dur + 0.02);
  } catch(e) {}
}

function snd(t, charIdx = 0) {
  if (!AC || !sv.vol) return;
  try {
    const n = AC.currentTime, v = sv.vol * 0.42;
    const playNoise = (dur, fStart, fEnd, q = 1.5, gainMult = 1, type = 'bandpass') => {
      if (!noiseBuf) return;
      const src = AC.createBufferSource(), flt = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = noiseBuf; flt.type = type; flt.Q.value = q;
      flt.frequency.setValueAtTime(fStart, n);
      flt.frequency.exponentialRampToValueAtTime(Math.max(40, fEnd), n + dur);
      g.gain.setValueAtTime(v * gainMult, n);
      g.gain.exponentialRampToValueAtTime(0.001, n + dur);
      src.connect(flt); flt.connect(g); g.connect(AC.destination);
      src.start(n); src.stop(n + dur + 0.02);
    };
    const playTone = (type, f1, f2, dur, gainMult = 1) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, n);
      o.frequency.exponentialRampToValueAtTime(Math.max(25, f2), n + dur);
      g.gain.setValueAtTime(v * gainMult, n);
      g.gain.exponentialRampToValueAtTime(0.001, n + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(n); o.stop(n + dur + 0.02);
    };

    if (t === 'swish') {
      // Sharp martial arts air-cutting limb whoosh
      playNoise(0.11, 1400, 320, 2.2, 0.75);
      playTone('sine', 280, 90, 0.09, 0.35);
      if (R() < 0.65) voiceSFX(charIdx, 'atk');
    } else if (t === 'hit') {
      // Budokai Tenkaichi punch/kick impact: crisp slap + sub-bass thud
      playNoise(0.14, 2400, 180, 1.2, 1.1, 'lowpass');
      playTone('triangle', 190, 38, 0.15, 1.2);
      playTone('square', 420, 75, 0.07, 0.55);
    } else if (t === 'hvy') {
      // Bone-crushing Smash / Sonic Boom Kick impact!
      playNoise(0.32, 3200, 90, 0.9, 1.45, 'lowpass');
      playTone('sawtooth', 150, 28, 0.32, 1.35);
      playTone('sine', 95, 22, 0.35, 1.5);
      voiceSFX(charIdx, 'hvy');
    } else if (t === 'blk') {
      // Metallic Z-Guard deflection + energy shield ricochet ZING!
      playTone('triangle', 1450, 520, 0.14, 0.85);
      playTone('square', 680, 1950, 0.09, 0.5);
      playNoise(0.10, 3000, 900, 4.0, 0.7);
    } else if (t === 'vanish') {
      // Iconic DBZ Instant Transmission "BZZT-PEW!"
      playTone('sine', 1800, 320, 0.12, 0.85);
      playTone('sawtooth', 350, 2400, 0.14, 0.6);
      playNoise(0.09, 4000, 1200, 3.0, 0.5);
    } else if (t === 'ki') {
      // Rapid Ki Blast laser pulse
      playTone('sawtooth', 880, 240, 0.16, 0.75);
      playTone('sine', 1400, 480, 0.14, 0.6);
      playNoise(0.12, 2200, 600, 2.5, 0.45);
    } else if (t === 'spb') {
      // Signature Special Wave (Kamehameha / Galick Gun roar)
      playNoise(0.65, 1800, 220, 0.8, 1.3, 'lowpass');
      playTone('sawtooth', 140, 580, 0.65, 1.0);
      playTone('square', 280, 110, 0.65, 0.75);
      voiceSFX(charIdx, 'sp');
    } else if (t === 'beam') {
      // Massive Ultimate Finisher Detonation Beam
      playNoise(0.95, 2600, 120, 0.7, 1.6, 'lowpass');
      playTone('sawtooth', 95, 480, 0.95, 1.2);
      playTone('triangle', 65, 30, 0.95, 1.4);
      voiceSFX(charIdx, 'ult');
    } else if (t === 'tr') {
      // Super Saiyan Lightning Transformation Awakening
      playNoise(0.85, 3500, 250, 1.0, 1.4, 'bandpass');
      playTone('sawtooth', 90, 820, 0.85, 1.15);
      playTone('sine', 180, 1240, 0.85, 0.8);
      voiceSFX(charIdx, 'ult');
    } else if (t === 'boom') {
      // Earth-shattering K.O. / Crater explosion
      playNoise(0.65, 900, 45, 0.6, 1.65, 'lowpass');
      playTone('sine', 110, 22, 0.6, 1.5);
    } else if (t === 'jmp') {
      playNoise(0.1, 900, 2400, 2.0, 0.55);
      playTone('sine', 220, 580, 0.11, 0.55);
    } else if (t === 'fly') {
      // High-speed Z-Burst flight sonic boom
      playNoise(0.24, 1800, 350, 1.2, 0.95);
      playTone('triangle', 160, 540, 0.2, 0.75);
    } else if (t === 'chg') {
      // Throbbing Ki Aura hum + electric crackle
      playTone('sawtooth', 115, 230, 0.16, 0.55);
      playNoise(0.14, 2800, 1200, 4.5, 0.45);
    }
  } catch(e) {}
}

function addShockwave(x, y, col, maxR = 65) {

function addImpactStar(x, y, col, sz = 36) {

}

/* PHYSICS & SKY FLIGHT */
function phys(f) {
  if (f.fly && !f.ko && f.stun <= 0) {
    // Smooth hovering damping in sky mode
    f.vx *= 0.86;
    f.vy *= 0.86;
  } else if (f.y < G) {
    f.vy += 0.68; // Gravity
  }
  f.x = cl(f.x + f.vx, 36, W - 36);
  f.y = cl(f.y + f.vy, 95, G);
  if (f.y >= G) {
    f.y = G;
    f.vy = 0;
    if (f.fly && f.inp.d) f.fly = 0; // Touch down when pressing down at ground
  }
  if (f.hu && f === F1) {
    $('#btn-fly').classList.toggle('active-fly', !!f.fly);
  }
}

const zoom = (f, n) => { M.zt = 1.38; M.zf = f; M.zc = n; };
const dmgOf = (f, b) => b * (f.c.pw / 10) * (1 + 0.26 * f.fm) * (1 + Math.min(f.cmb, 12) * 0.04);

function hurt(d, a, b, kb, bm) {
  if (d.ko || d.tf > 0) return;
  let m = dmgOf(a, b);
  if (d.blk && bm > 0) {
    m *= bm;
    d.vx = a.f * 3.5;
    snd('blk', d.ci);
    burst(d.x + d.f * 14, d.y - 52, '#7ce0ff', 10, 5.0);
    addShockwave(d.x + d.f * 12, d.y - 52, '#7ce0ff', 42);
    addImpactStar(d.x + d.f * 14, d.y - 52, '#7ce0ff', 28);
  } else {
    d.stun = 11 + (Math.min(m, 30) * 0.5 | 0);
    d.vx = a.f * kb;
    // Vertical knockback adapts to aerial combat
    if (a.fly || d.y < G - 10) {
      d.vy = (d.y - a.y) * 0.08 + (kb > 7 ? -3.5 : -1);
    } else if (kb > 6) {
      d.vy = -6.5;
    }
    d.a = null; d.ut = 0; d.dsh = 0;
    a.cmb++; a.ct = 115;
    M.hs = Math.max(M.hs, m > 15 ? 7 : 3);
    M.sk = Math.max(M.sk, m > 15 ? 11 : 5);
    if (m > 22) M.fl = 0.32;
    const hitX = (a.x + d.x) * 0.5, hitY = d.y - 55;
    burst(hitX, hitY, a.c.ac[a.fm], 16, 7.0);
    addShockwave(hitX, hitY, a.c.ac[a.fm], m > 15 ? 82 : 48);
    addImpactStar(hitX, hitY, m > 15 ? '#ffee55' : a.c.ac[a.fm], m > 15 ? 54 : 34);
    snd(m > 15 ? 'hvy' : 'hit', a.ci);
    if (R() < 0.45) voiceSFX(d.ci, 'hurt');
    a.ki = Math.min(100, a.ki + 5);
    d.ki = Math.min(100, d.ki + 3.5);
  }
  d.hp -= m;
  if (d.hp <= 0) {
    if (M.mode === 'train') {
      d.hp = d.mhp;
    } else {
      d.hp = 0; d.ko = 1; d.fly = 0;
      d.vy = -9.5; d.vx = a.f * 7;
      M.slow = 72; M.sk = 20; M.fl = 0.85;
      zoom(d, 65); snd('boom', a.ci);
      addShockwave(d.x, d.y - 50, '#ff5522', 130);
      M.msg = ['K.O.!', 120, '#ff4020'];
      endRound(a);
    }
  }
}

function endRound(w) { M.ph = 'ko'; M.pt = 170; M.winner = w; }

function strike(f, o, a) {
  const A = ATK[a.k], dx = (o.x - f.x) * f.f;
  if (dx > -18 && dx < A.r + 22 && ab(o.y - f.y) < 80) {
    hurt(o, f, A.m, A.kb, 0.22);
  } else {
    burst(f.x + f.f * 36, f.y - 56, '#fff', 5, 3.5);
  }
}

const at = (f, k) => {
  // Cycle through 4 authentic DBZ martial arts combo moves:
  // 0: Straight Jab -> 1: Spinning High Kick -> 2: Flying Knee / Gut Hook -> 3: High-Speed Flurry Barrage!
  if (k === 'l') f.seq = ((f.seq || 0) + 1) % 4;
  else if (k === 'h') f.seq = ((f.seq || 0) + 1) % 2;
  f.a = { k, t: 0, d: ATK[k].d, h: ATK[k].h, seq: f.seq || 0 };
  f.dsh = 0;

};

/* AI LOGIC WITH SKY FLIGHT & SIGNATURE BEAMS */
function think(f, o) {
  const I = f.inp = {};
  if (f.lv < 0 || M.ph !== 'fight') return;
  const L = f.lv, P = f.pl, dx = ab(o.x - f.x), dy = o.y - f.y, r = R();
  if (--f.tm <= 0) {
    f.tm = Math.max(5, 28 - L * 4);
    P.mv = 0; P.my = 0; P.b = 0; P.ch = 0;
    if ((o.fly || o.y < G - 85) && !f.fly && r < 0.75) f.fly = 1;
    if (f.fly && !o.fly && o.y >= G - 10 && r < 0.25) f.fly = 0;
    if (!f.fly && r < 0.18 && L >= 2) f.fly = 1;

    if (f.fly) {
      if (dy < -28) P.my = -1;
      else if (dy > 28) P.my = 1;
    }

    if (o.a && dx < 145 && r < 0.14 * L + 0.12) {
      P.b = 18;
    } else if (dx > 270) {
      P.mv = sg(o.x - f.x);
      if (r < 0.22 && f.ki >= 35 && ab(dy) < 65) P.spbeam = 1;
      else if (r < 0.38 && f.ki >= 8) P.k = 1;
      else if (r < 0.52 && f.ki >= 5) P.dash = 1;
      else if (r < 0.68 && f.ki < 75 && L > 1) { P.ch = 1; P.mv = 0; }
      else if (!f.fly && r < 0.78) P.u = 1;
    } else if (dx > 95) {
      P.mv = sg(o.x - f.x);
      if (r < 0.22 && f.ki >= 35 && ab(dy) < 60) P.spbeam = 1;
      else P[r < 0.42 ? 's' : r < 0.65 ? 'h' : r < 0.8 ? 'k' : 'dash'] = 1;
    } else {
      P.mv = r < 0.15 ? -sg(o.x - f.x) : sg(o.x - f.x);
      if (ab(dy) > 55 && f.fly) {
        P.my = sg(dy);
      } else if (r < 0.46) P.a = 1;
      else if (r < 0.72) P.h = 1;
      else if (r < 0.86) P.s = 1;
      else P.b = 14;
    }
    if (f.ki >= 80 && L > 1 && R() < 0.65 && dx < 540 && ab(dy) < 85) P.ult = 1;
    if (f.ki >= 50 && f.fm < f.c.f.length - 1 && L > 1 && dx > 140 && R() < 0.45) P.tr = 1;
  }
  I.l = P.mv < 0; I.r = P.mv > 0;
  I.u = P.my < 0; I.d = P.my > 0;
  I.blk = P.b-- > 0; I.ch = P.ch;
  for (const k of ['a','h','s','k','spbeam','ult','dash','tr']) {
    if (P[k]) { I[k] = 1; P[k] = 0; }
  }
}

/* UPDATE FIGHTER */
function upd(f, o) {
  f.an++;
  f.ct > 0 ? f.ct-- : f.cmb = 0;
  const on = M.ph === 'fight';
  if (!f.hu && on) think(f, o);
  const I = on ? f.inp : {}, p = {};
  for (const k in I) p[k] = I[k] && !f.pp[k];
  f.pp = { ...I };

  // Record afterimage trail when flying or dashing
  if ((f.dsh > 0 || (f.fly && Math.hypot(f.vx, f.vy) > 4)) && f.an % 2 === 0) {
    f.trail.push({ x: f.x, y: f.y, f: f.f, c: f.c.ac[f.fm], a: 0.55 });
    if (f.trail.length > 5) f.trail.shift();
  }
  f.trail.forEach(t => t.a -= 0.08);
  f.trail = f.trail.filter(t => t.a > 0);

  f.ki = Math.min(100, f.ki + 0.06);
  if (M.mode === 'train' && f.hu) f.ki = 100;

  if (f.ko) { phys(f); f.vx *= 0.95; return; }
  if (f.stun > 0) { f.stun--; f.vx *= 0.88; phys(f); return; }
  if (f.tf > 0) { f.tf--; f.vx = 0; f.vy = 0; aur(f); return; }
  if (f.ut > 0) {
    f.ut--; f.vx = 0; f.vy = 0; aur(f);
    if (f.ut === (f.utKind === 'ult' ? 42 : 26)) fireSpecialOrUlt(f, f.utKind);
    return;
  }
  if (f.fm > 0 || f.fly) aur(f);

  f.f = sg(o.x - f.x);
  const gr = f.y >= G - 1, sp = f.c.sp * (1 + 0.13 * f.fm);
  if (gr && !f.fly) f.jc = 0;

  // Active Attack state
  if (f.a) {
    const a = f.a; a.t++;
    if (a.t === a.h) a.k === 'k' ? shoot(f) : strike(f, o, a);
    if (a.k === 's' && a.t < a.h + 5) {
      f.vx = f.f * 10;
      if (f.fly) f.vy = cl((o.y - f.y) * 0.14, -6, 6);
    } else {
      f.vx *= 0.72;
      if (f.fly) f.vy *= 0.72;
    }
    phys(f);
    if (a.k === 'm' && f.y >= G) { slam(f, o); f.a = null; }
    else if (a.t >= a.d) f.a = null;
    return;
  }

  // 1) ULTIMATE ATTACK: 💥 ULT button, I key, or R (Guard) + Circle (Ki) (Requires 80 Ki)
  const wantUlt = p.ult || (I.blk && p.k);
  if (wantUlt && f.ki >= 80) {
    f.ki -= 80; f.ut = 72; f.utKind = 'ult';
    zoom(f, 75); M.fl = 0.6;
    M.msg = [f.c.u.toUpperCase() + '!', 82, f.c.utCol || f.c.ac[f.fm]];
    snd('chg', f.ci); return;
  }

  // 2) SIGNATURE SPECIAL BEAM (Kamehameha / Galick Gun / Masenko): ☄️ SPECIAL button, U key, or L (Charge) + Circle (Ki) (Requires 35 Ki)
  const wantSpBeam = p.spbeam || (I.ch && p.k);
  if (wantSpBeam && f.ki >= 35) {
    f.ki -= 35; f.ut = 44; f.utKind = 'sp';
    zoom(f, 45); M.fl = 0.35;
    M.msg = [f.c.spAttack.toUpperCase() + '!', 60, f.c.spCol || f.c.ac[f.fm]];
    snd('chg', f.ci); return;
  }

  // 3) TRANSFORM: ⚡ FORM button, E key, or L (Charge) + Triangle (Smash) (Requires 50 Ki)
  const wantTr = p.tr || (I.ch && p.h);
  if (wantTr && f.fm < f.c.f.length - 1 && f.ki >= 50) {
    f.ki -= 50; f.fm++; f.tf = 68;
    zoom(f, 70); M.msg = [f.c.f[f.fm] + '!', 90, f.c.ac[f.fm]];
    M.fl = 0.75; M.sk = 16; snd('tr', f.ci);
    addShockwave(f.x, f.y - 50, f.c.ac[f.fm], 120);
    f.hp = Math.min(f.mhp, f.hp + f.mhp * 0.12);
    return;
  }

  // Toggle Flight via Fly Button or Holding Up in Air
  if (p.flyTog) {
    f.fly = !f.fly;
    if (f.fly && f.y >= G - 4) f.vy = -9;
    snd('fly', f.ci);
    addShockwave(f.x, f.y - 30, f.c.ac[f.fm], 45);
  }
  if (!gr && I.u && !f.fly) {
    f.uHold = (f.uHold || 0) + 1;
    if (f.uHold > 14) { f.fly = 1; snd('fly', f.ci); addShockwave(f.x, f.y - 30, f.c.ac[f.fm], 45); }
  } else {
    f.uHold = 0;
  }

  // Guard & Charge (Works in mid-air flight too!)
  const wantsGuard = I.blk || (!f.fly && gr && I.d);
  f.blk = wantsGuard && !I.ch ? 1 : 0;
  f.ch = I.ch && !f.blk ? 1 : 0;

  // Z-Burst Homing Dash / Vanish Teleport (Cross Button / Shift)
  if (p.dash && f.ki >= 4 && !f.ch) {
    if (I.blk || (I.d && !f.fly)) {
      // Z-Vanish Instant Transmission behind enemy!
      if (f.ki >= 12) {
        f.ki -= 12;
        burst(f.x, f.y - 50, '#7ce8ff', 16, 5.5);
        addShockwave(f.x, f.y - 50, '#7ce8ff', 50);
        f.x = cl(o.x + sg(o.x - f.x) * 68, 40, W - 40);
        f.y = cl(o.y, 95, G);
        if (o.y < G - 20) f.fly = 1;
        f.f = sg(o.x - f.x);
        burst(f.x, f.y - 50, '#7ce8ff', 16, 5.5);
        snd('vanish', f.ci);
      }
    } else {
      // High-Speed Homing Z-Dash (flies straight toward opponent or stick direction)
      f.ki -= 4; f.dsh = 12;
      const dirX = (I.r ? 1 : 0) - (I.l ? 1 : 0);
      const dirY = (I.d ? 1 : 0) - (I.u ? 1 : 0);
      if (dirX !== 0 || dirY !== 0) {
        const len = Math.hypot(dirX, dirY) || 1;
        f.dd = (dirX / len) * 15.5;
        f.dy = (dirY / len) * 12.5;
        if (dirY < 0) f.fly = 1;
      } else {
        // Auto-homing towards enemy in 2D space!
        const ang = Math.atan2(o.y - f.y, o.x - f.x);
        f.dd = Math.cos(ang) * 16;
        f.dy = Math.sin(ang) * 14;
        if (o.y < G - 25) f.fly = 1;
      }
      burst(f.x, f.y - 45, f.c.ac[f.fm], 10, 4.5);
      addShockwave(f.x, f.y - 45, f.c.ac[f.fm], 52);
      snd('fly', f.ci);
    }
  }

  if (f.ch) {
    f.ki = Math.min(100, f.ki + 0.8);
    f.vx *= 0.5; f.vy *= 0.5;
    aur(f);
    if (f.an % 18 === 0) {
      snd('chg', f.ci);
      addShockwave(f.x, f.y - 45, f.c.ac[f.fm], 58);
    }
  } else if (f.blk) {
    f.vx *= 0.5; f.vy *= 0.5;
  } else if (f.dsh > 0) {
    f.dsh--;
    f.vx = f.dd;
    f.vy = f.dy;
    // Spawn anime speedlines
    if (SL.length < 25) SL.push({ x: f.x + (R()-0.5)*40, y: f.y - 45 + (R()-0.5)*50, vx: -f.vx*0.8, l: 8 });
  } else {
    f.vx = ((I.r ? 1 : 0) - (I.l ? 1 : 0)) * sp;
    if (f.fly) {
      f.vy = ((I.d ? 1 : 0) - (I.u ? 1 : 0)) * (sp * 0.92);
    }
  }

  // Jumps & Attacks
  if (!f.blk && !f.ch) {
    if (p.u && !f.fly) {
      if (gr) {
        f.vy = -13.8; snd('jmp');
      } else if (f.jc < 1) {
        f.jc = 1; f.fly = 1; f.vy = -6;
        addShockwave(f.x, f.y, f.c.ac[f.fm], 45);
        snd('fly');
      }
    }
    if (p.a) {
      // Auto subtle step-in during rush combo
      f.vx += f.f * 3.5;
      if (f.fly && ab(o.y - f.y) < 70) f.vy += sg(o.y - f.y) * 2;
      at(f, 'l');
    } else if (p.h) {
      if (!gr && !f.fly && I.d) at(f, 'm');
      else at(f, (I.l || I.r) ? 's' : 'h');
    } else if (p.s) {
      at(f, 's');
    } else if (p.k && f.ki >= 7) {
      f.ki -= 7; at(f, 'k');
    }
  }
  phys(f);
}

/* MAIN GAME STEP */
function step() {
  if (M.hs > 0) { M.hs--; return; }
  if (M.slow > 0 && M.slow-- % 2) return;
  M.tick++;
  if (M.sk > 0) M.sk--;
  M.fl = Math.max(0, M.fl - 0.03);
  if (M.zc > 0 && !--M.zc) M.zt = 1;

  // Dynamic camera tracks horizontal AND aerial height smoothly
  const midX = (F1.x + F2.x) * 0.5;
  const midY = Math.min(300, (F1.y + F2.y) * 0.5 - 80);
  const dist = Math.hypot(F1.x - F2.x, (F1.y - F2.y) * 1.2);
  const autoZ = M.zt > 1 ? M.zt : cl(1.12 - dist / 1600, 0.86, 1.08);
  M.z += (autoZ - M.z) * 0.1;
  M.cx += ((M.zt > 1 && M.zf ? M.zf.x : cl(midX, 340, 620)) - M.cx) * 0.12;
  M.cy = (M.cy || 270) + ((M.zt > 1 && M.zf ? M.zf.y - 60 : cl(midY, 190, 300)) - (M.cy || 270)) * 0.12;

  if (M.msg && --M.msg[1] <= 0) M.msg = null;
  if (M.ph === 'intro') {
    if (--M.pt <= 0) M.ph = 'fight';
    else if (M.pt === 40) M.msg = ['FIGHT!', 40, '#ffd24a'];
  }

  upd(F1, F2);
  upd(F2, F1);

  // Body collision pushback when at similar altitude
  if (!F1.ko && !F2.ko && ab(F1.x - F2.x) < 28 && ab(F1.y - F2.y) < 55) {
    const s = sg(F1.x - F2.x);
    F1.x = cl(F1.x + s * 1.8, 36, W - 36);
    F2.x = cl(F2.x - s * 1.8, 36, W - 36);
  }
  if (M.mode === 'train') { F1.hp = F1.mhp; M.ph = 'fight'; }

  // Projectiles (Ki Blasts, Spirit Bombs, Supernovas & Destructo Discs!)
  PR = PR.filter(p => {
    p.x += p.vx; p.y += (p.vy || 0);
    const t = p.o === F1 ? F2 : F1;
    const hitR = (p.r || 12) + 22;
    if (!t.ko && ab(p.x - t.x) < hitR && ab(p.y - (t.y - 52)) < hitR + 18) {
      hurt(t, p.o, p.m, p.m > 30 ? 11 : 5, p.kind === 'disc' ? 0.05 : 0.25);
      burst(p.x, p.y, p.c, p.m > 30 ? 28 : 12, p.m > 30 ? 8 : 5.5);
      addShockwave(p.x, p.y, p.c, p.m > 30 ? 110 : 42);
      if (p.m > 30) snd('boom');
      return false;
    }
    for (const q of PR) {
      if (q !== p && q.o !== p.o && ab(q.x - p.x) < (p.r||12)+(q.r||12) && ab(q.y - p.y) < (p.r||12)+(q.r||12)) {
        burst(p.x, p.y, '#fff', 16, 6);
        addShockwave(p.x, p.y, '#fff', 55);
        if (p.m > q.m) { q.r = 0; return true; }
        return false;
      }
    }
    return p.r !== 0 && p.x > -80 && p.x < W + 80 && p.y > -80 && p.y < H + 80;
  });

  // Special & Ultimate Energy Waves (Kamehameha, Galick Gun, Final Flash, etc.)
  BM = BM.filter(b => {
    b.t--;
    if (b.t % 4 === 0) {
      const t = b.o === F1 ? F2 : F1;
      if (!t.ko && (t.x - b.x) * b.f > 0 && ab((t.y - 52) - b.y) < (b.h || 60)) {
        hurt(t, b.o, b.dmg || 20, b.isUlt ? 4.5 : 3.2, 0.35);
        if (t.y >= G - 10) CR.push({ x: t.x, l: 600 });
      }
    }
    return b.t > 0;
  });

  PT = PT.filter(q => { q.x += q.vx; q.y += q.vy; q.vy += q.m > 30 ? 0.12 : 0; return --q.l > 0; });
  SW = SW.filter(s => { s.r += (s.mr - s.r) * 0.22; s.a -= 0.06; return s.a > 0.02; });
  SL = SL.filter(l => { l.x += l.vx; return --l.l > 0; });
  IFX = IFX.filter(s => --s.l > 0);
  CR = CR.filter(c => --c.l > 0).slice(-8);

  if (M.ph === 'ko') {
    if (M.winner && !M.winner.ko && M.pt < 110) M.winner.vic = 1;
    if (--M.pt <= 0) afterRound();
  } else if (M.ph === 'fight' && M.time != null && ++M.tt % 60 === 0 && --M.time <= 0) {
    const w = F1.hp / F1.mhp >= F2.hp / F2.mhp ? F1 : F2, l = w === F1 ? F2 : F1;
    l.ko = 1; l.vy = -8; M.msg = ['TIME UP!', 90, '#ffffff']; endRound(w);
  }
}

function selScreen() {

        ⚡ Forms: ${curC.f.join(' ➔ ')}
      </div>

      <h2>2. CHOOSE BATTLE LOCATION</h2>

const act = {
  go(v) { sel = { mode: v, st: sel.st ?? 0, p: null, cur: 0 }; selScreen(); },
  stg(v) { sel.st = +v; selScreen(); },
  pickChar(v) { sel.cur = +v; selScreen(); },
  confirm() {
    const v = sel.cur ?? 0;
    if (sel.mode === 'vs' && sel.p == null) {
      sel.p = v; sel.cur = (v + 1) % 6; selScreen();
    } else {
      startGame(sel.mode, sel.p == null ? v : sel.p, sel.p == null ? -1 : v);
    }
  },
  ori() {
    const order = ['auto', 'portrait', 'landscape'];
    sv.ori = order[(order.indexOf(sv.ori) + 1) % order.length];
    save(); applyOrientationAndLayout(); menu();
  },
  editlayout() {
    hide();
    document.body.classList.add('show-pad', 'edit-controls');
    applyOrientationAndLayout();
  },
  snd() { sv.vol = sv.vol ? 0 : 0.6; save(); menu(); },
  menu,
  resume() { togglePause(); },
  restart() { startGame(LS.mode, LS.a, LS.b); },
  retry() { arcSetup(); },
  nxt() { M.idx++; arcSetup(); },
  quit() { menu(); }
};

ui.onclick = e => {
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled) { au(); act[b.dataset.a](b.dataset.v); }
};

function startGame(mode, a, b) {
  LS = { mode, a, b };
  const o = C.map((_, i) => i).filter(i => i !== a).sort(() => R() - 0.5);
  M = {
    mode, p: [a, b], wins: [0, 0], round: 1, idx: 0, wave: 1,
    hs: 0, slow: 0, sk: 0, fl: 0, z: 1, zt: 1, zc: 0, cx: 480, cy: 270,
    tick: 0, pause: 0, lv: 0, hpm: 1, stg: 0,
    opps: o.slice(0, 6).map((ci, i) => ({ ci, lv: [1, 2, 2, 3, 4, 5][i] }))
  };
  if (mode === 'surv') { M.p[1] = o[0]; M.lv = 2; }
  if (mode === 'train') { M.p[1] = o[0]; M.lv = -1; }
  ST = 'bat';
  document.body.classList.add('bt');
  if (mode === 'arc') arcSetup();
  else {
    M.stg = sel.st >= 0 ? sel.st : (R() * S.length | 0);
    hide(); newRound();
  }
}

function arcSetup() {
  const o = M.opps[M.idx];
  M.p[1] = o.ci; M.lv = o.lv; M.hpm = M.idx === 5 ? 1.35 : 1;
  M.wins = [0, 0]; M.round = 1;
  M.stg = sel.st >= 0 ? sel.st : (M.idx % S.length);
  hide(); newRound();
}

function newRound() {
  F1 = mk(M.p[0], 0, 1, 0);
  F2 = mk(M.p[1], 1, M.mode === 'vs', M.lv);
  F2.mhp = F2.hp = F2.th = F2.mhp * M.hpm;
  PR = []; BM = []; PT = []; SW = []; SL = []; IFX = [];
  M.ph = 'intro'; M.pt = 95; M.tt = 0; M.slow = 0; M.zt = 1; M.winner = 0;
  M.time = M.mode === 'arc' || M.mode === 'vs' ? 99 : null;
  M.msg = [M.mode === 'train' ? 'SKY TRAINING' : M.mode === 'surv' ? 'WAVE ' + M.wave : 'ROUND ' + M.round, 60, '#ffffff'];
  // Update dynamic Special & Ultimate button labels to match chosen Warrior!
  $('#lbl-sp').textContent  = F1.c.spAttack.split(' ')[0].toUpperCase();
  $('#lbl-ult').textContent = F1.c.u.split(' ')[0].toUpperCase();
}

function over(t, s, bs) {
  show(`<h1 style="font-size:clamp(2rem,5vw,3.4rem)">${t}</h1><div style="font-size:1.1rem;color:#bfe8ff;margin-bottom:0.4rem">${s}</div><div class="menu-btns">${bs.map(x => btn(x[0], x[1], '', x[2] || '')).join('')}</div>`);
}

function afterRound() {
  const w = M.winner, p1 = w === F1;
  if (M.mode === 'surv') {
    if (p1) {
      M.wave++; sv.xp += 15; sv.zeni += 30; save();
      F1.hp = Math.min(F1.mhp, F1.hp + F1.mhp * 0.32); F1.vic = 0;
      const o = C.map((_, i) => i).filter(i => i !== M.p[0]);
      F2 = mk(o[R() * o.length | 0], 1, 0, Math.min(5, 1 + (M.wave / 2 | 0)));
      F2.mhp = F2.hp = F2.th = F2.mhp * (1 + 0.06 * M.wave);
      PR = []; BM = []; SW = []; IFX = []; M.ph = 'intro'; M.pt = 70;
      M.msg = ['WAVE ' + M.wave, 60, '#ffffff'];
    } else {
      over('GAME OVER', 'Waves Survived: ' + (M.wave - 1), [['restart', '🔄 Try Again', 'start-btn'], ['menu', '🏠 Main Menu']]);
    }
    return;
  }
  M.wins[p1 ? 0 : 1]++;
  if (M.wins[0] < 2 && M.wins[1] < 2) { M.round++; newRound(); return; }
  if (M.mode === 'vs') {
    over(p1 ? 'PLAYER 1 WINS!' : 'PLAYER 2 WINS!', 'Best of 3 Match Complete', [['restart', '⚔️ Rematch', 'start-btn'], ['menu', '🏠 Main Menu']]);
  } else if (!p1) {
    over('DEFEATED', 'Stage ' + (M.idx + 1) + ' of 6', [['retry', '🔄 Retry Stage', 'start-btn'], ['menu', '🏠 Main Menu']]);
  } else {
    sv.xp += 45; sv.zeni += 120;
    if (M.idx >= 5) {
      sv.wins++; sv.xp += 120; sv.zeni += 500; save();
      over('ARCADE CLEARED!', '+620 Zeni · New Warriors Unlocked!', [['menu', '🏠 Main Menu', 'start-btn']]);
    } else {
      save();
      over('STAGE ' + (M.idx + 1) + ' CLEAR!', '+120 Zeni · +45 XP', [['nxt', '➡ Next Opponent', 'start-btn'], ['menu', '🏠 Main Menu']]);
    }
  }
}

let dragEl = null;
document.querySelectorAll('#pad .ctrl-item').forEach(el => {
  el.addEventListener('pointerdown', e => {
    if (!document.body.classList.contains('edit-controls')) return;
    e.stopPropagation(); e.preventDefault();
    dragEl = el;
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
  }, true);

  el.addEventListener('pointermove', e => {
    if (dragEl !== el || !document.body.classList.contains('edit-controls')) return;
    e.stopPropagation(); e.preventDefault();
    const xPct = cl((e.clientX / window.innerWidth) * 100, 5, 95);
    const yPct = cl((e.clientY / window.innerHeight) * 100, 8, 95);
    el.style.left = xPct + 'vw';
    el.style.top  = yPct + 'vh';
    const mode = getActiveOrientation();
    if (!sv.layouts) sv.layouts = { portrait: {}, landscape: {} };
    if (!sv.layouts[mode]) sv.layouts[mode] = {};
    sv.layouts[mode][el.dataset.id] = { x: Math.round(xPct * 10) / 10, y: Math.round(yPct * 10) / 10 };
  }, true);

  const endDrag = e => {
    if (dragEl === el) {
      el.classList.remove('dragging');
      dragEl = null;
      save();
    }
  };
  el.addEventListener('pointerup', endDrag, true);
  el.addEventListener('pointercancel', endDrag, true);
});

/* KEYBOARD & PSP TOUCH INPUT */
const KM1 = {
  KeyA:'l', KeyD:'r', KeyW:'u', KeyS:'d',
  KeyJ:'a', KeyK:'h', KeyL:'k', KeyU:'spbeam', KeyI:'ult',
  ShiftLeft:'dash', KeyE:'tr', Space:'ch', KeyF:'flyTog', KeyB:'blk'
};
const KM2 = {
  ArrowLeft:'l', ArrowRight:'r', ArrowUp:'u', ArrowDown:'d',
  KeyN:'a', KeyM:'h', Comma:'k', Period:'spbeam', Slash:'ult',
  ShiftRight:'dash', Enter:'tr', KeyO:'ch', KeyP:'flyTog'
};

const key = (e, v) => {
  if (e.code === 'Escape') { v && !e.repeat && togglePause(); return; }
  if (ST !== 'bat') return;
  let k = KM1[e.code]; if (k) { K1[k] = v; e.preventDefault(); }
  k = KM2[e.code]; if (k) { K2[k] = v; e.preventDefault(); }
};
onkeydown = e => { au(); key(e, 1); };
onkeyup = e => key(e, 0);

// Analog Thumbstick 360° Handler
const js = $('#js'), kn = $('#kn');
function jm(e) {
  if (document.body.classList.contains('edit-controls')) return;
  const r = js.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2);
  const dy = e.clientY - (r.top + r.height / 2);
  const maxR = r.width * 0.42;
  const dist = Math.hypot(dx, dy) || 1;
  const clDist = Math.min(maxR, dist);
  const ux = (dx / dist) * clDist, uy = (dy / dist) * clDist;
  kn.style.transform = `translate(${ux}px, ${uy}px)`;
  K1.l = dx < -maxR * 0.28;
  K1.r = dx >  maxR * 0.28;
  K1.u = dy < -maxR * 0.32;
  K1.d = dy >  maxR * 0.32;
}
js.onpointerdown = e => {
  if (document.body.classList.contains('edit-controls')) return;
  au(); js.setPointerCapture(e.pointerId); jm(e);
};
js.onpointermove = e => { if (e.buttons && !document.body.classList.contains('edit-controls')) jm(e); };
js.onpointerup = js.onpointercancel = () => {
  K1.l = K1.r = K1.u = K1.d = 0;
  kn.style.transform = '';
};
document.addEventListener('contextmenu', e => e.preventDefault());

/* HIGH-DEFINITION CEL-SHADED DBZ FIGHTER & DYNAMIC MARTIAL ARTS CHOREOGRAPHY */
function drawF(c, f, x, y) {
  const ch = f.c, d = f.f || 1, fm = f.fm || 0, t = f.an || 0;
  const air = f.y < G - 2 || f.fly, a = f.a;
  const L = (p, q, e) => p + (q - p) * e;
  const hc = ch.fc[fm], auraCol = ch.ac[fm] || '#ffffff';

  // Draw Z-Dash / Flight Afterimages with full silhouette
  if (f.trail && f.trail.length) {
    for (const tr of f.trail) {
      c.save();
      c.globalAlpha = tr.a * 0.42;
      c.translate(tr.x, tr.y);
      c.fillStyle = tr.c;
      c.beginPath(); c.arc(0, -88, 13.5, 0, 7); c.fill();
      c.strokeStyle = tr.c; c.lineWidth = 12; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, -76); c.lineTo(0, -38); c.stroke();
      c.restore();
    }
  }

  // Authentic DBZ Martial Arts Guard & Idle Stance
  let fa = [0.85, -0.55], ba = [1.15, -0.25], fl = [1.28, 1.62], bl = [1.92, 1.58], ln = 0, rot = 0;
  const bob = Math.sin(t * 0.14) * (f.fly ? 4.5 : 2.0);

  if (ab(f.vx) > 0.8 && !air) {
    const s = Math.sin(t * 0.34);
    fl = [1.52 + s * 0.85, 2.08 + s * 0.85];
    bl = [1.52 - s * 0.85, 2.08 - s * 0.85];
    fa = [1.5 - s * 0.65, 0.82 - s * 0.65];
    ba = [1.5 + s * 0.65, 0.82 + s * 0.65];
    ln = 4.5;
  }
  if (air) {
    const tilt = cl(f.vx * d * 0.045, -0.32, 0.48);
    fl = [0.92 + tilt, 2.18];
    bl = [1.58 + tilt, 2.38];
    fa = [0.62, -0.58];
    ba = [1.22, -0.28];
    ln = f.vx * d * 0.7;
  }
  if (f.dsh > 0) {
    ln = 14; rot = d * 0.18;
    fa = [2.4, 2.6]; ba = [2.5, 2.7]; fl = [2.1, 2.4]; bl = [2.3, 2.5];
  }
  if (f.blk) { fa = [-0.1, -1.55]; ba = [0.15, -1.35]; ln = -3.5; }
  if (f.ch || f.tf > 0) { fa = [1.2, 1.4]; ba = [1.4, 1.6]; fl = [1.08, 1.9]; bl = [2.02, 1.75]; }

  // REALISTIC DBZ BUDOKAI TENKAICHI COMBO CHOREOGRAPHY
  if (a) {
    // snappy windup -> explosive snap extension -> follow-through
    const rawP = cl(a.t / a.d, 0, 1);
    const e = rawP < 0.38 ? Math.pow(rawP / 0.38, 0.55) : Math.sin(rawP * Math.PI);
    const seq = a.seq || 0;

    if (a.k === 'l') {
      if (seq === 0) {
        // 1. Snappy Dragon Straight Cross Punch with torso twist
        fa = [L(0.9, -0.08, e), L(-0.5, -0.05, e)];
        ba = [1.75, 2.25];
        fl = [1.1, 1.55]; bl = [2.05, 1.75];
        ln = 8.5 * e;
      } else if (seq === 1) {
        // 2. High Snap Roundhouse Kick to the head!
        fl = [L(1.25, -0.52, e), L(1.6, -0.45, e)];
        bl = [1.62, 1.68];
        fa = [1.65, 0.9]; ba = [0.65, -0.45];
        ln = -6 * e; rot = -d * 0.14 * e;
      } else if (seq === 2) {
        // 3. Crushing Rising Uppercut / Flying Knee Smash!
        fa = [L(1.15, -0.85, e), L(0.4, -1.35, e)];
        fl = [L(1.25, 0.25, e), L(1.65, 1.85, e)];
        ln = 7 * e; rot = -d * 0.08 * e;
      } else {
        // 4. High-Speed Anime Fist & Kick Barrage (ATATATATA!)
        const cyc = Math.sin(a.t * 1.85);
        fa = [cyc * 0.28, cyc * 0.18];
        ba = [-cyc * 0.28, -cyc * 0.18];
        fl = [1.05, 1.55]; bl = [2.08, 1.75];
        ln = 9.5;
      }
    } else if (a.k === 'h') {
      if (seq % 2 === 0) {
        // Heavy Spinning Heel Axe Kick!
        fl = [L(1.3, -0.68, e), L(1.6, -0.35, e)];
        bl = [1.65, 1.72];
        fa = [1.85, 1.15]; ba = [0.45, -0.55];
        ln = -7.5 * e; rot = -d * 0.22 * e;
      } else {
        // Double-Handed Overhead Sledgehammer Smash!
        fa = ba = [L(-1.45, 0.48, e), L(-1.65, 0.65, e)];
        fl = [1.05, 1.5]; bl = [2.05, 1.78];
        ln = 11 * e; rot = d * 0.16 * e;
      }
    } else if (a.k === 's') {
      // Budokai Sonic Dragon Dash Elbow / Flying Side Kick!
      fl = [L(1.2, 0.02, e), L(1.5, 0.04, e)];
      bl = [1.65, 2.35];
      fa = [0.1, -0.2]; ba = [1.8, 2.1];
      ln = 13 * e; rot = d * 0.2 * e;
    } else if (a.k === 'k') {
      // Ki Blast Thrust
      fa = [L(1, -0.05, e), 0]; ba = [1.3, -0.3]; ln = 4 * e;
    } else {
      // Meteor Dive Kick
      fa = ba = [1.6, 1.6]; fl = [0.82, 0.9]; bl = [2.15, 1.7]; rot = d * 0.25;
    }
  }
  if (f.ut > 0) {
    // Iconic Kamehameha Cupped Hands at Hip -> Explosive Dual-Palm Forward Thrust!
    const charging = f.ut > (f.utKind === 'ult' ? 42 : 26);
    fa = ba = charging ? [1.65, 0.85] : [-0.04, -0.04];
    ln = charging ? -4 : 10;
  }
  if (f.vic) { fa = ba = [-1.2, -1.6]; }
  if (f.stun > 0) { ln = -10; rot = -d * 0.18; fa = [2.2, 1.5]; ba = [2.4, 1.7]; }

  // Multi-Layered Blazing Anime Ki Aura
  if (!f.ko && (fm > 0 || f.ch || f.tf > 0 || f.ut > 25 || f.fly || f.dsh > 0)) {
    const intensity = (f.ch || f.tf > 0 || f.ut > 25) ? 1.32 : (fm > 0 ? 1.04 : 0.68);
    c.save();
    c.translate(x, y - 50 + bob);
    // Outer jagged flame crown
    c.fillStyle = auraCol;
    c.globalAlpha = (0.3 + 0.12 * Math.sin(t * 0.45)) * intensity;
    c.beginPath();
    const spikes = 16;
    for (let i = 0; i <= spikes; i++) {
      const ang = (i / spikes) * Math.PI * 2;
      const rad = (i % 2 === 0 ? 40 : 26) * intensity + Math.sin(t * 0.55 + i * 2) * 5;
      const px = Math.cos(ang) * rad * 0.9;
      const py = Math.sin(ang) * rad * 1.48 - 6;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath(); c.fill();

    // Inner white-hot core glow
    const g = c.createRadialGradient(0, -4, 4, 0, -4, 44 * intensity);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.45, auraCol);
    g.addColorStop(1, auraCol + '00');
    c.globalAlpha = 0.58 * intensity;
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, -4, 32 * intensity, 56 * intensity, 0, 0, 7); c.fill();

    // Electric Bio-Lightning arcs
    if (fm >= 1 || f.ch || f.tf > 0) {
      c.strokeStyle = fm >= 2 ? '#ffffff' : '#9ee8ff';
      c.lineWidth = 2.0; c.globalAlpha = 0.9;
      for (let k = 0; k < 2; k++) {
        if ((t + k * 7) % 3 === 0) {
          let lx = (R() - 0.5) * 38, ly = -45 + (R() - 0.5) * 64;
          c.beginPath(); c.moveTo(lx, ly);
          for (let s = 0; s < 3; s++) {
            lx += (R() - 0.5) * 24; ly += (R() - 0.5) * 24;
            c.lineTo(lx, ly);
          }
          c.stroke();
        }
      }
    }
    c.restore();
  }

  c.save();
  c.translate(x + ((f.ch || f.tf > 0) ? (R() - 0.5) * 3.5 : 0), y + bob);
  if (f.ko) { c.rotate(-d * 1.48); c.translate(0, -4); }
  else if (rot) { c.rotate(rot); }
  c.lineCap = c.lineJoin = 'round';

  const sk = ch.hs === 'bald' ? hc : '#ffdbb5';
  const sh = [ln * d * 0.6, -78], hp = [0, -42];
  const lim = (p, ang, l) => [p[0] + Math.cos(ang) * l * d, p[1] + Math.sin(ang) * l];

  // Piccolo / Cape Flowing Cloth Texture Behind Fighter
  if (ch.style === 'cape') {
    const capeWave = Math.sin(t * 0.22) * 8 - f.vx * d * 2.2;
    c.fillStyle = '#090a10';
    c.beginPath();
    c.moveTo(sh[0] - d * 9, sh[1] - 2);
    c.lineTo(sh[0] - d * 28 + capeWave, hp[1] + 28);
    c.lineTo(hp[0] + d * 5, hp[1] + 22);
    c.closePath(); c.fill();
    c.fillStyle = '#eef2ff';
    c.beginPath();
    c.moveTo(sh[0] - d * 7, sh[1]);
    c.lineTo(sh[0] - d * 25 + capeWave, hp[1] + 25);
    c.lineTo(hp[0] + d * 3, hp[1] + 19);
    c.closePath(); c.fill();
  }

  // ANATOMICAL CEL-SHADED MUSCULAR LIMB & BAGGIE GI PANTS RENDERER
  const limb = (p, u, l, w, isArm, isBack) => {
    const m = lim(p, u[0], l), e = lim(m, u[1], l);
    c.save();
    if (isBack) c.globalAlpha = 0.8;

    const upperW = isArm ? w + 1.2 : w + 3.2; // Baggy DBZ Gi pants / muscular thighs
    const lowerW = isArm ? w - 0.2 : w + 1.4;

    // 1. Dark Ink Outline Pass
    c.strokeStyle = '#090a10';
    c.lineWidth = upperW + 3.6;
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(m[0], m[1]); c.stroke();
    c.lineWidth = lowerW + 3.4;
    c.beginPath(); c.moveTo(m[0], m[1]); c.lineTo(e[0], e[1]); c.stroke();

    // 2. Main Muscle / Gi Texture Fill
    const upperCol = (isArm && (ch.style === 'gi' || ch.style === 'broly' || ch.style === 'god')) ? sk : ch.c;
    c.strokeStyle = upperCol;
    c.lineWidth = upperW;
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(m[0], m[1]); c.stroke();

    c.strokeStyle = isArm ? (ch.style === 'armor' || ch.style === 'jacket' ? ch.c : sk) : ch.c;
    c.lineWidth = lowerW;
    c.beginPath(); c.moveTo(m[0], m[1]); c.lineTo(e[0], e[1]); c.stroke();

    // 3. Cel-Shaded Rim Highlight & Cloth Fold Creases
    c.strokeStyle = 'rgba(255,255,255,0.28)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(p[0] + d * 1.5, p[1]);
    c.lineTo(m[0] + d * 1.5, m[1]);
    c.stroke();

    if (!isArm) {
      // Gi Pant knee fold & shin wraps
      c.strokeStyle = 'rgba(0,0,0,0.32)';
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(m[0] - 3, m[1] - 2); c.lineTo(m[0] + 3, m[1] + 2);
      c.stroke();
    }

    if (isArm) {
      // Martial Arts Wristbands / Saiyan Gloves
      const wx = L(m[0], e[0], 0.68), wy = L(m[1], e[1], 0.68);
      c.strokeStyle = '#090a10'; c.lineWidth = lowerW + 3.2;
      c.beginPath(); c.moveTo(wx, wy); c.lineTo(e[0], e[1]); c.stroke();
      c.strokeStyle = ch.c2; c.lineWidth = lowerW + 0.8;
      c.beginPath(); c.moveTo(wx, wy); c.lineTo(e[0], e[1]); c.stroke();

      // Clenched Fist with Knuckle Highlight
      const fistCol = ch.style === 'armor' ? '#ffffff' : sk;
      c.fillStyle = '#090a10'; c.beginPath(); c.arc(e[0], e[1], 5.6, 0, 7); c.fill();
      c.fillStyle = fistCol; c.beginPath(); c.arc(e[0], e[1], 4.1, 0, 7); c.fill();

      // Glowing Ki Hand during attacks/charge
      if (f.ch || f.ut > 0 || (a && (a.k === 'k' || a.k === 'l' || a.k === 'h'))) {
        c.fillStyle = auraCol; c.globalAlpha = 0.78;
        c.beginPath(); c.arc(e[0], e[1], 7.5, 0, 7); c.fill();

    // Anime hair highlight sheen

    if (ch.hs === 'long') {

  // Shouting mouth during attacks / charging
  if (a || f.ch || f.ut > 0 || f.tf > 0) {

  // Front Leg & Front Arm

  // HIGH-SPEED ANIME COMBAT SMEAR ARCS & FLURRY FISTS!
  if (a && a.k !== 'k' && a.t >= 2 && a.t <= a.d - 2) {
    const isKick = (a.k === 'h' && a.seq % 2 === 0) || (a.k === 'l' && a.seq === 1) || a.k === 's' || a.k === 'm';

      c.beginPath();
      c.arc(sh[0], sh[1] + 12, isKick ? 42 : 34, (d > 0 ? -0.85 : 2.25), (d > 0 ? 0.75 : 3.95));

      c.beginPath();
      c.arc(sh[0], sh[1] + 12, isKick ? 42 : 34, (d > 0 ? -0.55 : 2.55), (d > 0 ? 0.55 : 3.65));

      c.fillStyle = auraCol; c.globalAlpha = 0.85;
      c.beginPath(); c.arc(tip[0], tip[1], a.k === 'h' ? 11 : 8, 0, 7); c.fill();
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(tip[0], tip[1], 4.5, 0, 7); c.fill();
    }
    c.restore();
  }

  // Charging Kamehameha / Galick Gun Energy Sphere in Cupped Hands
  if (f.ut > (f.utKind === 'ult' ? 42 : 26)) {
    const col = f.utKind === 'ult' ? (f.c.utCol || auraCol) : (f.c.spCol || auraCol);
    const r = 8 + (t % 6) * 1.5;
    c.save();
    c.fillStyle = col; c.globalAlpha = 0.85;
    c.beginPath(); c.arc(handPos[0], handPos[1], r * 1.4, 0, 7); c.fill();
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(handPos[0], handPos[1], r * 0.7, 0, 7); c.fill();
    c.restore();
  }

  // Guard Energy Shield Bubble
  if (f.blk) {
    c.save();
    c.strokeStyle = '#66e0ff'; c.fillStyle = 'rgba(80, 210, 255, 0.25)';
    c.lineWidth = 2.8;
    c.beginPath(); c.ellipse(d * 8, -54, 29, 49, 0, 0, 7);
    c.fill(); c.stroke();
    c.restore();
  }

  c.restore();
}

/* STUNNING MULTI-LAYERED PARALLAX ENVIRONMENTS */
function bg(i) {
  const s = S[i] || S[0];
  const off = ST === 'bat' && F1 ? (F1.x + F2.x) * 0.5 - 480 : Math.sin(TK * 0.005) * 180;

  // 3-Stop Rich Sky Gradient
  const g = X.createLinearGradient(0, -250, 0, G);
  g.addColorStop(0, s.sky1);
  g.addColorStop(0.55, s.sky2);
  g.addColorStop(1, s.sky3);
  X.fillStyle = g;
  X.fillRect(-500, -450, 1960, 450 + G);

  // Twinkling Stars in Space / Glacier / Wasteland Dusk
  if (i === 4 || i === 3 || i === 0) {
    X.fillStyle = '#ffffff';
    const count = i === 4 ? 95 : 35;
    for (let k = 0; k < count; k++) {
      X.globalAlpha = (i === 4 ? 0.45 : 0.2) + 0.35 * Math.sin(TK * 0.05 + k);
      X.fillRect(((k * 137.5) % 1600) - 320 - off * 0.03, ((k * 53.3) % 360) - 160, 2.2, 2.2);
    }
    X.globalAlpha = 1;
  }

  // Celestial Sun / Planet / Ringed Gas Giant
  const sunX = 740 - off * 0.05, sunY = 95;
  const sg2 = X.createRadialGradient(sunX, sunY, 8, sunX, sunY, 110);
  sg2.addColorStop(0, '#ffffff');
  sg2.addColorStop(0.35, s.sun);
  sg2.addColorStop(1, s.sun + '00');
  X.fillStyle = sg2;
  X.beginPath(); X.arc(sunX, sunY, 110, 0, 7); X.fill();

  if (i === 4) { // Space Orbit Ringed Planet
    X.save();
    X.translate(230 - off * 0.04, 120);
    X.fillStyle = '#3b287a';
    X.beginPath(); X.arc(0, 0, 46, 0, 7); X.fill();
    X.strokeStyle = '#9d7aff88'; X.lineWidth = 6;
    X.beginPath(); X.ellipse(0, 0, 88, 16, -0.25, 0, 7); X.stroke();
    X.restore();
  }
  if (i === 1) { // Planet Namek Twin Suns
    X.fillStyle = '#fff9a688';
    X.beginPath(); X.arc(210 - off * 0.03, 85, 26, 0, 7); X.fill();
  }

  // Drifting Parallax Clouds (where aerial battles happen!)
  if (i !== 4) {
    X.fillStyle = i === 2 ? 'rgba(90, 25, 20, 0.55)' : 'rgba(255, 255, 255, 0.45)';
    for (const cld of CLOUDS) {
      cld.x += cld.sp;
      if (cld.x > 1350) cld.x = -350;
      const cx = cld.x - off * 0.12;
      X.beginPath();
      X.ellipse(cx, cld.y, cld.w, 18, 0, 0, 7);
      X.ellipse(cx - cld.w * 0.35, cld.y + 6, cld.w * 0.6, 13, 0, 0, 7);
      X.ellipse(cx + cld.w * 0.35, cld.y + 5, cld.w * 0.65, 14, 0, 0, 7);
      X.fill();
    }
  }

  // Distant & Midground Mountain Ranges
  const mountainLayer = (col, base, amp, fr, sh, al) => {
    X.save();
    X.globalAlpha = al; X.fillStyle = col;
    X.beginPath(); X.moveTo(-500, G);
    for (let x = -500; x <= 1460; x += 22) {
      const y = base - amp * ab(Math.sin((x + sh) * fr)) - amp * 0.38 * Math.sin((x + sh) * fr * 2.4);
      X.lineTo(x, y);
    }
    X.lineTo(1460, G); X.closePath(); X.fill();
    X.restore();
  };
  mountainLayer(s.mtn1, G - 55, 155, 0.0038, -off * 0.09, 0.68);
  mountainLayer(s.mtn2, G - 12, 92, 0.0068, -off * 0.22, 0.95);

  // Stage-Specific Landmarks
  if (i === 5) { // Hyperbolic Time Chamber Temple Pillars
    X.fillStyle = '#d8e4f5';
    [-180, 1140].forEach(px => {
      const x = px - off * 0.25;
      X.fillRect(x, G - 190, 34, 190);
      X.fillStyle = '#c8963e';
      X.beginPath(); X.arc(x + 17, G - 195, 28, Math.PI, 0); X.fill();
      X.fillStyle = '#d8e4f5';
    });
  }

  // Ground Plane with Depth Perspective Grid
  const gg = X.createLinearGradient(0, G, 0, G + 180);
  gg.addColorStop(0, s.grd);
  gg.addColorStop(1, s.grd2);
  X.fillStyle = gg;
  X.fillRect(-500, G, 1960, 300);

  // Horizon Rim Highlight
  X.fillStyle = i === 2 ? '#ff6600aa' : '#ffffff66';
  X.fillRect(-500, G, 1960, 4);

  // Perspective Ground Lines
  X.strokeStyle = 'rgba(0,0,0,0.22)';
  X.lineWidth = 2;
  for (let k = -12; k <= 12; k++) {
    const gx = 480 + k * 90 - (off * 0.55) % 90;
    X.beginPath();
    X.moveTo(gx, G);
    X.lineTo(480 + (gx - 480) * 2.4, G + 180);
    X.stroke();
  }

  // Weather & Atmospheric Particles
  if (s.wx) {
    for (const q of WX) {
      if (s.wx === 'snow') {
        X.fillStyle = '#ffffffcc';
        q.y += q.s * 1.4; q.x += Math.sin(TK * 0.02 + q.a) * 0.6;
      } else if (s.wx === 'ash') {
        X.fillStyle = '#ff7722cc';
        q.y -= q.s * 1.3; q.x += Math.sin(TK * 0.03 + q.a) * 0.8;
      } else {
        X.fillStyle = '#c4ff9ecc';
        q.y -= q.s * 0.5;
      }
      if (q.y > H) q.y = -40;
      if (q.y < -40) q.y = H;
      X.beginPath(); X.arc(q.x, q.y, 2.2, 0, 7); X.fill();
    }
  }

  // Impact Craters
  for (const c of CR) {
    X.fillStyle = 'rgba(0,0,0,0.48)';
    X.beginPath(); X.ellipse(c.x, G + 5, 44, 7, 0, 0, 7); X.fill();
  }
}

/* BUDOKAI ARCADE HUD */
function hud() {
  [F1, F2].forEach((f, i) => {
    const L = !i, x0 = L ? 22 : W - 22, bw = 370, hp = cl(f.hp / f.mhp, 0, 1);
    f.th = Math.max(f.hp, f.th - 0.65);

    const bar = (fr, y, h, col, w) => {
      X.fillStyle = col;
      X.fillRect(L ? x0 : x0 - w * fr, y, w * fr, h);
    };

    // Character Name & Active Transformation + Sky Badge
    X.textAlign = L ? 'left' : 'right';
    X.font = 'italic 900 17px system-ui';
    X.fillStyle = '#ffffff';
    const skyTag = f.fly ? ' 🕊️SKY' : '';
    X.fillText(`${f.c.n.toUpperCase()} · ${f.c.f[f.fm]}${skyTag}`, x0, 21);

    // Health Bar Frame
    X.fillStyle = 'rgba(0,0,0,0.72)';
    X.fillRect(L ? x0 - 3 : x0 - bw - 3, 26, bw + 6, 22);
    bar(cl(f.th / f.mhp, 0, 1), 29, 16, '#ff4444aa', bw);

    const g = X.createLinearGradient(0, 29, 0, 45);
    g.addColorStop(0, hp > 0.3 ? '#88ff55' : '#ff6a4a');
    g.addColorStop(1, hp > 0.3 ? '#189828' : '#a81010');
    bar(hp, 29, 16, g, bw);

    // Ki Gauge Frame
    X.fillStyle = 'rgba(0,0,0,0.72)';
    X.fillRect(L ? x0 - 3 : x0 - 270 - 3, 52, 276, 13);
    const kiCol = f.ki >= 80 ? (TK % 16 < 8 ? '#ffd800' : '#ffffff') : f.ki >= 35 ? '#3ce8ff' : '#1b98ff';
    bar(f.ki / 100, 54, 9, kiCol, 270);
    // 35 Ki Special & 80 Ki Ultimate Markers
    X.fillStyle = '#ffffffaa';
    X.fillRect(L ? x0 + 94 : x0 - 96, 52, 2, 13);
    X.fillRect(L ? x0 + 216 : x0 - 218, 52, 2, 13);

    X.font = 'bold 11px system-ui';
    X.fillStyle = '#ffd644';
    const hint = f.ki >= 80
      ? `💥 ${f.c.u.toUpperCase()} READY!`

      ? `⚡ FORM / ☄️ ${f.c.spAttack.toUpperCase()} READY`
      : f.ki >= 35
      ? `☄️ ${f.c.spAttack.toUpperCase()} READY`
      : '';
    X.fillText(hint, x0, 78);

    // Round Win Orbs (Dragon Spheres)
    if (M.mode === 'arc' || M.mode === 'vs') {
      for (let k = 0; k < M.wins[i]; k++) {
        const ox = x0 + (L ? 1 : -1) * (k * 20 + 8);
        X.fillStyle = '#ff9900';
        X.beginPath(); X.arc(ox, 92, 7.5, 0, 7); X.fill();
        X.fillStyle = '#ffee55';
        X.beginPath(); X.arc(ox - 2, 90, 2.2, 0, 7); X.fill();
      }
    }

    if (f.cmb > 1 && f.ct > 0) {
      X.font = 'italic 900 32px system-ui';
      X.fillStyle = '#ffcc00';
      X.fillText(f.cmb + ' HITS!', x0, 138);
    }
  });

  // Center Timer & Stage Name
  X.textAlign = 'center';
  X.font = '900 36px system-ui';
  X.fillStyle = '#ffffff';
  X.fillText(M.time != null ? M.time : M.mode === 'surv' ? 'WAVE ' + M.wave : '∞', W / 2, 46);
  X.font = 'bold 11px system-ui';
  X.fillStyle = '#a8d8ff';
  X.fillText(S[M.stg].name.toUpperCase(), W / 2, 62);

  if (!document.body.classList.contains('show-pad')) {
    X.font = 'bold 12px system-ui';
    X.fillStyle = 'rgba(255,255,255,0.75)';
    X.fillText('PC: WASD Move/Fly · F Sky Flight · J Rush · K Smash · L Ki · U Special (35 Ki) · I Ultimate (80 Ki) · E Form · Space Aura', W / 2, H - 10);
  }

  if (M.msg) {
    X.save();
    X.translate(W / 2, 225);
    const s = 1 + 0.1 * Math.sin(M.msg[1] * 0.3);
    X.scale(s, s);
    X.font = 'italic 900 58px system-ui';
    X.textAlign = 'center';
    X.lineWidth = 8; X.strokeStyle = '#000';
    X.strokeText(M.msg[0], 0, 0);
    X.shadowColor = M.msg[2]; X.shadowBlur = 28;
    X.fillStyle = M.msg[2];
    X.fillText(M.msg[0], 0, 0);
    X.restore();
  }
  if (M.fl > 0) {
    X.fillStyle = `rgba(255,255,255,${M.fl})`;
    X.fillRect(0, 0, W, H);
  }
}

/* RENDER LOOP */
function render() {
  TK++;
  X.setTransform(1, 0, 0, 1, 0, 0);
  X.clearRect(0, 0, W, H);

  if (ST === 'bat' && F1) {
    const sx = M.sk > 0 ? (R() - 0.5) * M.sk : 0;
    const sy = M.sk > 0 ? (R() - 0.5) * M.sk : 0;
    X.save();
    X.translate(W / 2 + sx, 280 + sy);
    X.scale(M.z, M.z);
    X.translate(-M.cx, -(M.cy || 270));
    bg(M.stg);

    // Speedlines
    X.strokeStyle = 'rgba(255,255,255,0.55)';
    X.lineWidth = 2;
    for (const l of SL) {
      X.beginPath(); X.moveTo(l.x, l.y); X.lineTo(l.x - l.vx * 3, l.y); X.stroke();
    }

    // Ground Shadows & Fighters
    [F1, F2].sort((a, b) => b.ko - a.ko).forEach(f => {
      const shScale = cl(1 - (G - f.y) / 420, 0.25, 1);
      X.fillStyle = `rgba(0,0,0,${0.45 * shScale})`;
      X.beginPath(); X.ellipse(f.x, G + 4, 28 * shScale, 5.5 * shScale, 0, 0, 7); X.fill();
      drawF(X, f, f.x, f.y);
    });

    // Expanding Shockwave Rings
    for (const s of SW) {
      X.save();
      X.strokeStyle = s.c;
      X.globalAlpha = s.a;
      X.lineWidth = 3.5;
      X.beginPath(); X.arc(s.x, s.y, s.r, 0, 7); X.stroke();
      X.restore();
    }

    // DBZ Anime Starburst Impact Flashes (On Punch / Kick / Block Contact!)
    for (const st of IFX) {
      X.save();
      X.translate(st.x, st.y);
      X.rotate(st.rot + st.l * 0.2);
      const sc = (st.l / st.m);
      X.globalAlpha = sc;
      X.fillStyle = st.c;
      X.beginPath();
      const pts = 8;
      for (let i = 0; i < pts * 2; i++) {
        const rad = (i % 2 === 0 ? st.sz : st.sz * 0.28) * (1.15 - sc * 0.3);
        const ang = (i / (pts * 2)) * Math.PI * 2;
        i ? X.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad) : X.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
      }
      X.closePath(); X.fill();
      X.fillStyle = '#ffffff';
      X.beginPath(); X.arc(0, 0, st.sz * 0.26, 0, 7); X.fill();
      X.restore();
    }

    // Special & Ultimate Energy Beams (Kamehameha, Galick Gun, Final Flash, etc.)
    for (const b of BM) {
      const prog = Math.sin(Math.PI * (b.maxT - b.t) / b.maxT);
      const h = (b.h || 64) * prog + 10;
      const startX = b.f > 0 ? b.x + 24 : b.x - 24;
      const beamW = b.f > 0 ? 1200 : -1200;
      X.save();
      X.fillStyle = b.c;
      X.globalAlpha = 0.42;
      X.fillRect(startX, b.y - h, beamW, h * 2);
      X.globalAlpha = 0.92;
      X.fillRect(startX, b.y - h * 0.5, beamW, h);
      X.fillStyle = '#ffffff';
      X.fillRect(startX, b.y - h * 0.24, beamW, h * 0.48);
      // Charging / Firing Origin Sphere & Spiral Rings
      X.beginPath(); X.arc(startX, b.y, h * 0.9, 0, 7); X.fill();
      X.strokeStyle = b.c; X.lineWidth = 3;
      for (let k = 1; k <= 5; k++) {
        const rx = startX + b.f * (k * 130 + (TK * 18) % 130);
        X.beginPath(); X.ellipse(rx, b.y, 10, h * 0.75, 0, 0, 7); X.stroke();
      }
      X.restore();
    }

    // Ki Blasts, Spirit Bombs, Supernovas & Destructo Discs
    for (const p of PR) {
      const r = p.r || 11.5;
      X.save();
      if (p.kind === 'disc') {
        // Spinning Destructo Disc
        X.translate(p.x, p.y);
        X.fillStyle = p.c; X.globalAlpha = 0.85;
        X.beginPath(); X.ellipse(0, 0, r * 1.35, r * 0.42, 0, 0, 7); X.fill();
        X.fillStyle = '#ffffff';
        X.beginPath(); X.ellipse(0, 0, r * 0.9, r * 0.22, 0, 0, 7); X.fill();
      } else {
        X.fillStyle = p.c;
        X.globalAlpha = 0.38;
        X.beginPath(); X.arc(p.x, p.y, r * 1.55, 0, 7); X.fill();
        X.globalAlpha = 0.95;
        X.beginPath(); X.arc(p.x, p.y, r, 0, 7); X.fill();
        X.fillStyle = '#ffffff';
        X.beginPath(); X.arc(p.x, p.y, r * 0.52, 0, 7); X.fill();
      }
      X.restore();
    }

    // Particles
    for (const q of PT) {
      X.globalAlpha = Math.max(0, q.l / q.m);
      X.fillStyle = q.c;
      X.beginPath(); X.arc(q.x, q.y, q.r, 0, 7); X.fill();
    }
    X.globalAlpha = 1;
    X.restore();
    hud();
  } else {
    // Animated Menu Attract Mode (Aerial Sky Clash!)
    bg((TK / 540 | 0) % S.length);
    const hoverY = G - 135 + Math.sin(TK * 0.05) * 18;
    [[C[0], 330, 1], [C[1], 630, -1]].forEach(([c, x, d]) => {
      drawF(X, {
        c, fm: Math.min(c.f.length - 1, (TK / 160 | 0) % 4),
        f: d, an: TK, y: hoverY, fly: 1, vx: 0, vy: 0, trail: []
      }, x, hoverY);
    });
  }
}

let last = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  acc += Math.min(ts - last, 100);
  last = ts;
  while (acc >= 16.67) {
    acc -= 16.67;
    if (ST === 'bat' && !M.pause) step();
  }
  render();
}
menu();
requestAnimationFrame(loop);
</script>
